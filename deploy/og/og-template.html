<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Plantilla de la imagen Open Graph (1200x630). Se renderiza con deploy/og/render.sh -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Playfair+Display:wght@600&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex;
    background: #0A2240;
    font-family: 'Geist', sans-serif;
    color: #fff;
  }
  .text {
    flex: 1;
    padding: 48px 40px 48px 72px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: radial-gradient(circle at 0% 0%, #123258 0%, #0A2240 60%);
  }
  .brand { display: flex; align-items: center; gap: 22px; margin-bottom: 28px; }
  .brand img { width: 84px; height: 84px; }
  .brand span {
    color: #C6A664;
    font-size: 27px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    line-height: 1.25;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 80px;
    line-height: 1.02;
    letter-spacing: -0.01em;
  }
  .rule { flex-shrink: 0; width: 120px; height: 5px; background: #C6A664; margin: 28px 0 26px; border-radius: 3px; }
  .areas { font-size: 40px; font-weight: 600; line-height: 1.25; }
  .areas small { display: block; font-size: 32px; font-weight: 500; color: #D6DDE8; margin-top: 8px; }
  .place { margin-top: 26px; font-size: 30px; font-weight: 500; color: #C6A664; }
  .photo {
    width: 430px;
    position: relative;
    background: url('../../assets/images/debora-dodelson.jpg') 58% 18% / cover no-repeat;
  }
  .photo::before {
    content: '';
    position: absolute; inset: 0 auto 0 0; width: 90px;
    background: linear-gradient(90deg, #0A2240, rgba(10, 34, 64, 0));
  }
  .photo::after {
    content: '';
    position: absolute; inset: 0 auto 0 0; width: 6px;
    background: #C6A664;
  }
</style>
</head>
<body>
  <div class="text">
    <div class="brand">
      <img src="../../assets/images/isotipo-badge.png" alt="">
      <span>Estudio Jurídico<br>Integral</span>
    </div>
    <h1>Dra. Débora<br>Dodelson</h1>
    <div class="rule"></div>
    <div class="areas">
      Derecho del Trabajo
      <small>Compliance · Civil · Comercial</small>
    </div>
    <div class="place">Córdoba · Presencial y virtual</div>
  </div>
  <div class="photo"></div>
</body>
</html>
